name: Release Tern

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tern-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node.js 24

      - name: Determine release signing mode
        run: |
          required=(
            APPLE_CERTIFICATE_BASE64
            APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY
            APPLE_ID
            APPLE_APP_SPECIFIC_PASSWORD
            APPLE_TEAM_ID
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              missing+=("${name}")
            fi
          done
          if (( ${#missing[@]} == ${#required[@]} )); then
            echo "SIGNED_RELEASE=false" >> "${GITHUB_ENV}"
            echo "::warning::Publishing an unsigned release because no Apple signing credentials are configured."
          elif (( ${#missing[@]} > 0 )); then
            echo "::error::Apple signing credentials are only partially configured. Missing: ${missing[*]}"
            exit 1
          else
            echo "SIGNED_RELEASE=true" >> "${GITHUB_ENV}"
          fi

      - name: Import Developer ID certificate
        if: ${{ env.SIGNED_RELEASE == 'true' }}
        run: |
          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/tern-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "${APPLE_CERTIFICATE_BASE64}" | base64 --decode > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -P "${APPLE_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security list-keychain -d user -s "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple: -k "${keychain_password}" "${keychain_path}"
          echo "TERN_CODESIGN_IDENTITY=${APPLE_SIGNING_IDENTITY}" >> "${GITHUB_ENV}"

      - name: Run tests
        run: swift test

      - name: Build release
        env:
          TERN_BUILD_CHANNEL: production
          TERN_VERSION: 0.1.${{ github.run_number }}
          TERN_BUILD_NUMBER: ${{ github.run_number }}
          TERN_UPDATE_REPOSITORY: ${{ github.repository }}
          TERN_UNIVERSAL: 1
        run: ./scripts/build-app.sh release

      - name: Notarize signed apps
        if: ${{ env.SIGNED_RELEASE == 'true' }}
        run: |
          ditto -c -k --norsrc --keepParent build/Tern.app "${RUNNER_TEMP}/Tern-notarization.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/Tern-notarization.zip" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --wait
          xcrun stapler staple build/Tern.app
          xcrun stapler validate build/Tern.app

      - name: Package release assets
        env:
          VERSION: 0.1.${{ github.run_number }}
        run: |
          mkdir -p dist
          ditto -c -k --norsrc --keepParent build/Tern.app "dist/Tern-${VERSION}.zip"
          ./scripts/create-dmg.sh build/Tern.app "dist/Tern-${VERSION}.dmg"
          if [[ -n "${TERN_CODESIGN_IDENTITY:-}" ]]; then
            codesign --force --sign "${TERN_CODESIGN_IDENTITY}" "dist/Tern-${VERSION}.dmg"
          fi

      - name: Notarize disk image
        if: ${{ env.SIGNED_RELEASE == 'true' }}
        env:
          VERSION: 0.1.${{ github.run_number }}
        run: |
          xcrun notarytool submit "dist/Tern-${VERSION}.dmg" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --wait
          xcrun stapler staple "dist/Tern-${VERSION}.dmg"
          xcrun stapler validate "dist/Tern-${VERSION}.dmg"

      - name: Verify app signature integrity
        run: |
          ./scripts/verify-bundle.sh build/Tern.app universal

      - name: Verify Gatekeeper acceptance
        if: ${{ env.SIGNED_RELEASE == 'true' }}
        env:
          VERSION: 0.1.${{ github.run_number }}
        run: |
          spctl --assess --type execute --verbose=2 build/Tern.app
          spctl --assess --type open --context context:primary-signature --verbose=2 "dist/Tern-${VERSION}.dmg"

      - name: Create checksums
        env:
          VERSION: 0.1.${{ github.run_number }}
        run: |
          shasum -a 256 "dist/Tern-${VERSION}.zip" > "dist/Tern-${VERSION}.zip.sha256"
          shasum -a 256 "dist/Tern-${VERSION}.dmg" > "dist/Tern-${VERSION}.dmg.sha256"

      - name: Generate Homebrew cask
        env:
          VERSION: 0.1.${{ github.run_number }}
        run: |
          sha="$(shasum -a 256 "dist/Tern-${VERSION}.dmg" | awk '{print $1}')"
          signing="signed"; [[ "${SIGNED_RELEASE}" == "true" ]] || signing="unsigned"
          ./scripts/generate-cask.sh "${VERSION}" "${sha}" "${GITHUB_REPOSITORY}" "${signing}" > "${RUNNER_TEMP}/tern.rb"
          ruby -c "${RUNNER_TEMP}/tern.rb"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.1.${{ github.run_number }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" dist/* --clobber
          else
            title="Tern ${VERSION}"
            notes=()
            if [[ "${SIGNED_RELEASE}" != "true" ]]; then
              title="${title} (Unsigned)"
              notes=(--notes "⚠️ This build is ad-hoc signed and not Apple-notarized. macOS may require approval in System Settings → Privacy & Security on first launch.")
            fi
            gh release create "v${VERSION}" dist/* \
              --title "${title}" \
              --generate-notes \
              --target "${GITHUB_SHA}" \
              "${notes[@]}"
          fi

      - name: Update Homebrew tap
        # Needs the HOMEBREW_TAP_TOKEN secret (contents: write on the tap)
        # and the HOMEBREW_TAP_REPOSITORY variable, e.g. owner/homebrew-tern.
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' && env.HOMEBREW_TAP_REPOSITORY != '' }}
        env:
          VERSION: 0.1.${{ github.run_number }}
        run: |
          tap_dir="${RUNNER_TEMP}/tap"
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${HOMEBREW_TAP_REPOSITORY}.git" "${tap_dir}"
          mkdir -p "${tap_dir}/Casks"
          cp "${RUNNER_TEMP}/tern.rb" "${tap_dir}/Casks/tern.rb"
          cd "${tap_dir}"
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "tern ${VERSION}"
          git push

      - name: Remove signing material
        if: ${{ always() && env.SIGNED_RELEASE == 'true' }}
        run: |
          security delete-keychain "${RUNNER_TEMP}/tern-signing.keychain-db" || true
          rm -f "${RUNNER_TEMP}/developer-id.p12"
