name: Validate Tern
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: swift test
      - run: ./scripts/build-app.sh release
      - run: ./scripts/verify-bundle.sh 'build/Tern Dev.app'
